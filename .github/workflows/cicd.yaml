name: CI/CD pipeline

# Trigger for running job
on:
  push:
    branches: [ main ]

jobs:
  # Job 1: Build Docker image
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Cache Docker Image Layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys:
            - ${{ runner.os }}-buildx

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4  # Updated to v4
        with:
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/testCICD:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

  # Job 2: Deploy to Ubuntu server
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Ubuntu server
        uses: appleboy/ssh-action@v0.1.5  # Updated to v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} -p ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/testCICD:latest
            docker stop testCICD || true
            docker rm testCICD || true
            docker run -d -p 80:3000 --name testCICD \
              -e PORT=${{ secrets.PORT }} \
              ${{ secrets.DOCKER_HUB_USERNAME }}/testCICD:latest
